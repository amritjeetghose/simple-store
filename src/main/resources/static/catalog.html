<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog</title>
    <style>
      :root {
        --bg: #f5f5f4;
        --panel: #ffffff;
        --panel-soft: #fafaf9;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #57534e;
        --accent: #111827;
        --accent-soft: #e5e7eb;
        --shadow: 0 1px 2px rgba(28, 25, 23, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 52px auto;
        padding: 0 20px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.6rem);
        letter-spacing: -0.045em;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .icon-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-size: 22px;
        box-shadow: var(--shadow);
      }

      .badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .back {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .item {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 18px;
        background: var(--panel-soft);
      }

      .item strong {
        display: block;
        font-size: 1.05rem;
        margin-bottom: 4px;
      }

      .muted {
        color: var(--muted);
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-weight: 600;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.96;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Catalog</h1>
        <div class="header-actions">
          <a class="icon-link" href="cart.html" aria-label="Cart">
            🛒
            <span class="badge" id="cart-badge">0</span>
          </a>
          <a class="icon-link" href="orders.html" aria-label="Orders">
            🧾
            <span class="badge" id="orders-badge">0</span>
          </a>
          <a class="back" href="index.html">← Back</a>
        </div>
      </div>

      <div class="panel">
        <div id="catalog" class="list"></div>
      </div>
    </div>

    <script>
      async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "Request failed");
        }

        const type = response.headers.get("content-type") || "";
        if (type.includes("application/json")) return response.json();
        const text = await response.text();
        return text ? text : null;
      }

      function money(value) {
        return "$" + Number(value).toFixed(2);
      }

      async function loadHeaderBadges() {
        try {
          const [cart, orders] = await Promise.all([
            fetchJson("/api/cart"),
            fetchJson("/api/orders"),
          ]);

          const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
          document.getElementById("cart-badge").textContent = cartCount;
          document.getElementById("orders-badge").textContent = orders.length;
        } catch (error) {
          console.error("Unable to load header badges", error);
        }
      }

      async function loadCatalog() {
        const catalog = await fetchJson("/api/catalog");
        const catalogEl = document.getElementById("catalog");
        catalogEl.innerHTML = catalog
          .map(
            (product) => `
          <div class="item">
            <strong>${product.name}</strong><br>
            Price: ${money(product.price)}<br>
            Stock: ${product.stock}
            <div class="row">
              <span>Available</span>
              <button data-id="${product.id}" class="add-btn">Add to cart</button>
            </div>
          </div>
        `,
          )
          .join("");
      }

      document.addEventListener("click", async (event) => {
        const button = event.target.closest(".add-btn");
        if (!button) return;
        const productId = Number(button.dataset.id);
        try {
          await fetchJson("/api/cart/add", {
            method: "POST",
            body: JSON.stringify({ productId, quantity: 1 }),
          });
          alert("Added to cart");
          await loadHeaderBadges();
          await loadCatalog();
        } catch (error) {
          alert(error.message || "Unable to add item");
        }
      });

      loadHeaderBadges();
      loadCatalog();
    </script>
  </body>
</html>
