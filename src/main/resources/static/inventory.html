<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory</title>
    <style>
      :root {
        --bg: #f5f5f4;
        --panel: #ffffff;
        --panel-soft: #fafaf9;
        --border: #e7e5e4;
        --text: #1c1917;
        --muted: #57534e;
        --accent: #111827;
        --accent-soft: #e5e7eb;
        --shadow: 0 1px 2px rgba(28, 25, 23, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 52px auto;
        padding: 0 20px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 3vw, 2.6rem);
        letter-spacing: -0.045em;
      }

      .back {
        text-decoration: none;
        color: var(--text);
        font-weight: 600;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        box-shadow: var(--shadow);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .item {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px 18px;
        background: var(--panel-soft);
      }

      .item strong {
        display: block;
        margin-bottom: 4px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 12px;
      }

      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      button.secondary {
        background: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Inventory</h1>
        <a class="back" href="index.html">← Back</a>
      </div>

      <div class="panel">
        <div id="inventory" class="list"></div>
      </div>
    </div>

    <script>
      async function fetchJson(url, options = {}) {
        const response = await fetch(url, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        const type = response.headers.get("content-type") || "";
        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || "Request failed");
        }
        if (type.includes("application/json")) return response.json();
        const text = await response.text();
        return text ? text : null;
      }

      async function loadInventory() {
        const inventory = await fetchJson("/api/inventory");
        const entries = Object.entries(inventory);
        const inventoryEl = document.getElementById("inventory");
        inventoryEl.innerHTML = entries.length
          ? entries
              .map(
                ([id, stock]) => `
            <div class="item">
              <strong>Product ${id}</strong><br>
              Available: ${stock}
              <div class="row">
                <button data-id="${id}" class="add-btn">+ Add</button>
                <button data-id="${id}" class="remove-btn secondary">- Remove</button>
              </div>
            </div>
          `,
              )
              .join("")
          : "<p>No inventory</p>";
      }

      document.addEventListener("click", async (event) => {
        const addBtn = event.target.closest(".add-btn");
        if (addBtn) {
          const productId = Number(addBtn.dataset.id);
          try {
            await fetchJson("/api/inventory/add", {
              method: "POST",
              body: JSON.stringify({ productId, quantity: 1 }),
            });
            loadInventory();
          } catch (error) {
            alert(error.message || "Update failed");
          }
          return;
        }

        const removeBtn = event.target.closest(".remove-btn");
        if (removeBtn) {
          const productId = Number(removeBtn.dataset.id);
          try {
            await fetchJson("/api/inventory/remove", {
              method: "POST",
              body: JSON.stringify({ productId, quantity: 1 }),
            });
            loadInventory();
          } catch (error) {
            alert(error.message || "Update failed");
          }
        }
      });

      loadInventory();
    </script>
  </body>
</html>
